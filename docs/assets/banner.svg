<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7F9"/>
      <stop offset="48%" stop-color="#FCECF1"/>
      <stop offset="100%" stop-color="#F8DFE8"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 70) rotate(30) scale(340 240)">
      <stop offset="0%" stop-color="#E56B92" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E56B92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1070 250) rotate(-20) scale(360 240)">
      <stop offset="0%" stop-color="#A32952" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A32952" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E86B94"/>
      <stop offset="100%" stop-color="#9A2049"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E56B92" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#A32952" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E56B92" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#871D41" flood-opacity="0.16"/>
    </filter>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#A32952" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1278" height="318" rx="28" fill="url(#bgGrad)" stroke="url(#cardStroke)" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="316" rx="27" fill="url(#dotGrid)"/>
  <rect x="2" y="2" width="1276" height="316" rx="27" fill="url(#orb1)"/>
  <rect x="2" y="2" width="1276" height="316" rx="27" fill="url(#orb2)"/>

  <!-- Decorative subtle ticket notch accents on left & right -->
  <circle cx="0" cy="160" r="18" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="1280" cy="160" r="18" fill="#FFFFFF" fill-opacity="0.72"/>

  <!-- Centered Emblem Badge -->
  <g transform="translate(596, 38)" filter="url(#softShadow)">
    <rect width="88" height="88" rx="26" fill="url(#roseGrad)"/>
    <rect x="2" y="2" width="84" height="84" rx="24" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
    <!-- Stylized Rose Petals -->
    <g transform="translate(44, 44)">
      <path d="M0 -24 C12 -24 20 -13 17 -1 C14 10 5 16 0 19 C-5 16 -14 10 -17 -1 C-20 -13 -12 -24 0 -24 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M0 -15 C7 -15 11 -8 9 -1 C7 5 3 9 0 11 C-3 9 -7 5 -9 -1 C-11 -8 -7 -15 0 -15 Z" fill="#E86B94" fill-opacity="0.55"/>
      <circle cx="0" cy="-3" r="4.5" fill="#9A2049" fill-opacity="0.85"/>
      <circle cx="16" cy="-16" r="2.5" fill="#FFE0EB"/>
      <circle cx="-17" cy="13" r="2" fill="#FFE0EB" fill-opacity="0.85"/>
    </g>
  </g>

  <!-- Title -->
  <text x="640" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8" fill="#1E1619">
    RosePanel Bot
  </text>

  <!-- Subtitle -->
  <text x="640" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#6F5F66">
    四层防广告 Telegram 双向私聊机器人 · CAS 黑名单联防 · 拦广告海报图 · 贴纸自定义图形题 · 附送 0 秒启动个人面板
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(262, 244)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5" font-weight="600">
    <rect x="0" y="0" width="166" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.86" stroke="#A32952" stroke-opacity="0.16"/>
    <text x="83" y="22" text-anchor="middle" fill="#A32952">🛡️ CAS 黑名单零感知</text>

    <rect x="180" y="0" width="182" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.86" stroke="#A32952" stroke-opacity="0.16"/>
    <text x="271" y="22" text-anchor="middle" fill="#A32952">🖼️ 拦截纯图广告海报</text>

    <rect x="376" y="0" width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.86" stroke="#A32952" stroke-opacity="0.16"/>
    <text x="466" y="22" text-anchor="middle" fill="#A32952">🎭 自定义表情包猜题</text>

    <rect x="570" y="0" width="186" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.86" stroke="#A32952" stroke-opacity="0.16"/>
    <text x="663" y="22" text-anchor="middle" fill="#A32952">⚡ Cloudflare 0 元部署</text>
  </g>
</svg>
